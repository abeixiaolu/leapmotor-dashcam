name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# 串行部署，防止并发覆盖
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
          run_install: false
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm exec vp test run
        env:
          NODE_ENV: test
      
      - name: Type check
        run: pnpm run build
        env:
          NODE_ENV: production
      
      - name: Generate build manifest
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          cd dist
          find . -type f | sort | xargs sha256sum > ../build-manifest.txt
          echo "REVISION=${{ github.sha }}" >> ../build-manifest.txt
          echo "BUILD_TIME=$(date -u +%Y%m%d-%H%M%S)" >> ../build-manifest.txt
          echo "GITHUB_RUN_ID=${{ github.run_id }}" >> ../build-manifest.txt
          cd ..
      
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            dist/
            build-manifest.txt
          retention-days: 30
          if-no-files-found: error

  deploy-production:
    name: Deploy to Production
    needs: test-and-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read
    
    environment:
      name: production
      url: https://dashcam.abei.me
    
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/deploy.sh
          persist-credentials: false
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: ./
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # 使用 GitHub Actions 提供的已知主机密钥
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      
      - name: Deploy to production
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          REVISION: ${{ github.sha }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
      
      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -f ~/.ssh/known_hosts
